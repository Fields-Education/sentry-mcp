name: Sync Upstream

# Merges getsentry/sentry-mcp main into our main using only GITHUB_TOKEN.
#
# GITHUB_TOKEN can push upstream commits that touch .github/workflows as long
# as the pushed tip leaves our .github/workflows unchanged, so every merge
# resets that directory to ours (upstream workflows never land on the fork).
# Pushes made with GITHUB_TOKEN don't trigger other workflows, so the deploy is
# dispatched explicitly. Anything that doesn't merge or build fails the run
# and nothing is pushed; see packages/mcp-cloudflare-fields/README.md.

on:
  schedule:
    - cron: "0 6 * * *"
  repository_dispatch:
    types: [sync-upstream]
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      actions: write
    env:
      TARGET_BRANCH: main
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/getsentry/sentry-mcp.git
          git fetch upstream main

          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          if [ "$BEHIND" -eq 0 ]; then
            echo "Already up to date with upstream."
            exit 0
          fi

          git merge upstream/main --no-commit --no-ff || true

          # Keep exactly our workflows; this also resolves any upstream
          # workflow conflicts.
          git rm -rq --cached .github/workflows
          rm -rf .github/workflows
          git checkout HEAD -- .github/workflows

          CONFLICTS=$(git diff --name-only --diff-filter=U)
          if [ -n "$CONFLICTS" ]; then
            echo "::error::Merge conflicts need manual resolution:"
            echo "$CONFLICTS"
            exit 1
          fi
          git commit --no-edit -m "chore: sync with upstream sentry-mcp ($(git rev-parse --short upstream/main))"

      - name: Setup Node.js
        if: steps.merge.outputs.behind != '0'
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      # pnpm/action-setup@v6.1.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        if: steps.merge.outputs.behind != '0'
        with:
          run_install: false

      - name: Verify Fields build
        if: steps.merge.outputs.behind != '0'
        run: |
          pnpm install --frozen-lockfile
          node packages/mcp-cloudflare-fields/check-bindings.mjs
          cp packages/mcp-cloudflare-fields/wrangler.jsonc packages/mcp-cloudflare-fields/wrangler.canary.jsonc packages/mcp-cloudflare/
          pnpm --filter '@sentry/mcp-cloudflare...' run build
          git checkout -- packages/mcp-cloudflare

      - name: Push and deploy
        if: steps.merge.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin "HEAD:$TARGET_BRANCH"
          gh workflow run deploy-fields.yml --ref "$TARGET_BRANCH"
