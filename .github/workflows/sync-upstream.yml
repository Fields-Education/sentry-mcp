name: Sync Upstream

# Merges getsentry/sentry-mcp main into our main. The fork only *adds* files
# (Fields wrangler configs, these two workflows, `.disabled` renames of
# upstream workflows), so upstream merges apply cleanly. Anything that doesn't
# merge, install, or build fails the run (nothing is pushed) for manual
# resolution; see packages/mcp-cloudflare-fields/README.md.
#
# Requires the SYNC_TOKEN secret: a fine-grained PAT (or app token) with
# Contents + Workflows write on this repo. GITHUB_TOKEN can't push commits that
# touch .github/workflows, and its pushes don't trigger the deploy workflow.

on:
  schedule:
    - cron: "0 6 * * *"
  repository_dispatch:
    types: [sync-upstream]
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Require SYNC_TOKEN
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::SYNC_TOKEN secret is not set (needs Contents + Workflows write)."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Merge upstream
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/getsentry/sentry-mcp.git
          git fetch upstream main

          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          if [ "$BEHIND" -eq 0 ]; then
            echo "Already up to date with upstream."
            exit 0
          fi

          git merge upstream/main --no-edit \
            -m "chore: sync with upstream sentry-mcp ($(git rev-parse --short upstream/main))"

          # Keep every upstream workflow disabled; only ours may run.
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$f" ] || continue
            case "$(basename "$f")" in
              deploy-fields.yml|sync-upstream.yml) ;;
              *) git mv "$f" "$f.disabled" ;;
            esac
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: disable new upstream workflows"
          fi

      - name: Setup Node.js
        if: steps.merge.outputs.behind != '0'
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      # pnpm/action-setup@v6.1.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        if: steps.merge.outputs.behind != '0'
        with:
          run_install: false

      - name: Verify Fields build
        if: steps.merge.outputs.behind != '0'
        run: |
          pnpm install --frozen-lockfile
          node packages/mcp-cloudflare-fields/check-bindings.mjs
          cp packages/mcp-cloudflare-fields/wrangler.jsonc packages/mcp-cloudflare-fields/wrangler.canary.jsonc packages/mcp-cloudflare/
          pnpm --filter '@sentry/mcp-cloudflare...' run build
          git checkout -- packages/mcp-cloudflare

      # Fast-forward push (no force). Pushing with SYNC_TOKEN triggers
      # deploy-fields.yml.
      - name: Push
        if: steps.merge.outputs.behind != '0'
        run: git push origin HEAD:main
